    CanonicalMoney:
      type: string
      pattern: ^(?!-0\.00$)-?(?:0|[1-9][0-9]{0,17})\.[0-9]{2}$
      description: Canonical signed decimal money value with exactly two fractional digits.
        The wire value is derived from integer minor units; it is never a float.

    TimesheetHours:
      type: string
      pattern: ^(?:(?:[0-9]|1[0-9]|2[0-3])\.[0-9]{2}|24\.00)$
      description: Canonical decimal hours from 0.00 through 24.00 inclusive, with exactly
        two fractional digits. It is never a float.

    MutationMeta:
      additionalProperties: false
      properties:
        apiVersion:
          type: string
        compatibility:
          $ref: '#/components/schemas/Compatibility'
        idempotentReplay:
          type: boolean
        requestId:
          type: string
      type: object
      required:
      - apiVersion
      - compatibility
      - idempotentReplay
      - requestId
      description: Mutation envelope metadata. `idempotentReplay` is required and true
        when the response is a replay of a prior request with the same Idempotency-Key.

    EntityVersionConflictProblem:
      additionalProperties: false
      properties:
        code:
          type: string
          enum:
          - ENTITY_VERSION_CONFLICT
        detail:
          type: string
        details:
          additionalProperties: false
          properties:
            draftPreserved:
              type: boolean
              const: true
            currentEntityVersion:
              type:
              - string
              - 'null'
          type: object
          required:
          - draftPreserved
          - currentEntityVersion
        instance:
          type: string
        requestId:
          type: string
        status:
          type: integer
        title:
          type: string
        type:
          format: uri
          type: string
      type: object
      required:
      - code
      - detail
      - requestId
      - status
      - title
      - type
      description: 409 returned when an If-Match guard fails (stale entity version) or
        the document is locked. `details.draftPreserved` is always true; `currentEntityVersion`
        lets the client refetch.

    IdempotencyKeyReusedProblem:
      additionalProperties: false
      properties:
        code:
          type: string
          enum:
          - IDEMPOTENCY_KEY_REUSED
        detail:
          type: string
        instance:
          type: string
        requestId:
          type: string
        status:
          type: integer
        title:
          type: string
        type:
          format: uri
          type: string
      type: object
      required:
      - code
      - detail
      - requestId
      - status
      - title
      - type
      description: 409 returned when an Idempotency-Key is reused with a different request
        body than the first call that created the row.

    TimesheetCapabilities:
      additionalProperties: false
      properties:
        create:
          $ref: '#/components/schemas/NativeCapability'
        edit:
          $ref: '#/components/schemas/NativeCapability'
        read:
          $ref: '#/components/schemas/NativeCapability'
        void:
          $ref: '#/components/schemas/NativeCapability'
      type: object
      required:
