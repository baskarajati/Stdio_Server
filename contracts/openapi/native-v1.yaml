        - $ref: '#/components/schemas/CustomTaxRuleRationalDraft'
        - $ref: '#/components/schemas/CustomTaxRuleFixedDraft'

    CustomTaxRuleDraftBase:
      type: object
      required:
        - label
        - code
        - effectiveFrom
        - effectiveTo
        - sources
        - disclaimerText
        - unverifiedAcknowledgment
      properties:
        label: { type: string, minLength: 1 }
        code: { $ref: '#/components/schemas/CustomTaxRuleCode' }
        effectiveFrom: { type: string, format: date }
        effectiveTo:
          oneOf:
            - type: string
              format: date
            - $ref: '#/components/schemas/Null'
        sources:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/TaxRuleSource' }
        disclaimerText: { type: string, minLength: 1 }
        unverifiedAcknowledgment:
          type: object
          additionalProperties: false
          required: [accepted, acceptedText]
          properties:
            accepted: { const: true }
            acceptedText: { type: string, minLength: 1 }

    CustomTaxRuleRationalDraft:
      allOf:
        - $ref: '#/components/schemas/CustomTaxRuleDraftBase'
        - type: object
          additionalProperties: false
          required:
            - label
            - code
            - effectiveFrom
            - effectiveTo
            - sources
            - disclaimerText
            - unverifiedAcknowledgment
            - calculationMode
            - statutoryRateNumerator
            - statutoryRateDenominator
            - dppFactorNumerator
            - dppFactorDenominator
          properties:
            calculationMode: { const: RATIONAL_RATE }
            statutoryRateNumerator: { $ref: '#/components/schemas/PositiveRationalInteger' }
            statutoryRateDenominator: { $ref: '#/components/schemas/PositiveRationalInteger' }
            dppFactorNumerator: { $ref: '#/components/schemas/PositiveRationalInteger' }
            dppFactorDenominator: { $ref: '#/components/schemas/PositiveRationalInteger' }

    CustomTaxRuleFixedDraft:
      allOf:
        - $ref: '#/components/schemas/CustomTaxRuleDraftBase'
        - type: object
          additionalProperties: false
          required:
            - label
            - code
            - effectiveFrom
            - effectiveTo
            - sources
            - disclaimerText
            - unverifiedAcknowledgment
            - calculationMode
            - fixedAmount
          properties:
            calculationMode: { const: FIXED_AMOUNT }
            fixedAmount: { $ref: '#/components/schemas/MoneyInput' }

    CustomRuleAcknowledgment:
      type: object
      additionalProperties: false
      required: [accepted, acceptedText]
      properties:
        accepted: { const: true }
        acceptedText: { type: string, minLength: 1 }

    CustomTaxRuleWriteResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [rule]
          properties:
            rule:
              oneOf:
                - $ref: '#/components/schemas/TaxRuleCustomRational'
                - $ref: '#/components/schemas/TaxRuleCustomFixed'
        meta: { $ref: '#/components/schemas/NativeWriteMeta' }

    NativeWriteMeta:
      allOf:
        - $ref: '#/components/schemas/Meta'
        - type: object
          additionalProperties: true
          required: [idempotentReplay]
          properties:
            idempotentReplay: { type: boolean }
    SupplierTaxRecordingRequest:
      oneOf:
        - $ref: '#/components/schemas/SupplierTaxRecordingRequestIDR'
        - $ref: '#/components/schemas/SupplierTaxRecordingRequestNonIDR'

    SupplierTaxRecordingRequestIDR:
      type: object
      additionalProperties: false
      required: [supplierDocumentReference, label, documentCurrency, dppAmount,
        taxAmount, exchangeRateEvidence, source, acknowledgment]
      properties:
        supplierDocumentReference: { type: string, minLength: 1 }
        label: { type: string, minLength: 1 }
        documentCurrency: { const: IDR }
        dppAmount: { $ref: '#/components/schemas/MoneyInput' }
        taxAmount: { $ref: '#/components/schemas/MoneyInput' }
        exchangeRateEvidence: { $ref: '#/components/schemas/Null' }
        source: { $ref: '#/components/schemas/TaxRuleSource' }
        acknowledgment: { $ref: '#/components/schemas/CustomRuleAcknowledgment' }

    SupplierTaxRecordingRequestNonIDR:
      type: object
      additionalProperties: false
      required: [supplierDocumentReference, label, documentCurrency, dppAmount,
        taxAmount, exchangeRateEvidence, source, acknowledgment]
      properties:
        supplierDocumentReference: { type: string, minLength: 1 }
        label: { type: string, minLength: 1 }
        documentCurrency: { $ref: '#/components/schemas/NonIDRCurrencyCode' }
        dppAmount: { $ref: '#/components/schemas/MoneyInput' }
        taxAmount: { $ref: '#/components/schemas/MoneyInput' }
        exchangeRateEvidence: { $ref: '#/components/schemas/ExchangeRateEvidence' }
        source: { $ref: '#/components/schemas/TaxRuleSource' }
        acknowledgment: { $ref: '#/components/schemas/CustomRuleAcknowledgment' }

    SupplierTaxRecording:
      oneOf:
        - $ref: '#/components/schemas/SupplierTaxRecordingIDR'
        - $ref: '#/components/schemas/SupplierTaxRecordingNonIDR'

    SupplierTaxRecordingIDR:
      type: object
      additionalProperties: false
      required: [id, studioId, purchaseOrderId, supplierId, status,
        supplierDocumentReference, label, documentCurrency, dppAmount, taxAmount,
        exchangeRateEvidence, source, acceptedConfirmationText, recordedById,
        recordedAt, entityVersion]
      properties:
        id: { type: string, minLength: 1 }
        studioId: { type: string, minLength: 1 }
        purchaseOrderId: { type: string, minLength: 1 }
        supplierId: { type: string, minLength: 1 }
        status: { const: CUSTOM_UNVERIFIED }
        supplierDocumentReference: { type: string, minLength: 1 }
        label: { type: string, minLength: 1 }
        documentCurrency: { const: IDR }
        dppAmount: { $ref: '#/components/schemas/MoneyOutput' }
        taxAmount: { $ref: '#/components/schemas/MoneyOutput' }
        exchangeRateEvidence: { $ref: '#/components/schemas/Null' }
        source: { $ref: '#/components/schemas/TaxRuleSource' }
        acceptedConfirmationText: { type: string, minLength: 1 }
        recordedById: { type: string, minLength: 1 }
        recordedAt: { type: string, format: date-time }
        entityVersion: { type: string, minLength: 1 }

    SupplierTaxRecordingNonIDR:
      type: object
      additionalProperties: false
      required: [id, studioId, purchaseOrderId, supplierId, status,
        supplierDocumentReference, label, documentCurrency, dppAmount, taxAmount,
        exchangeRateEvidence, source, acceptedConfirmationText, recordedById,
        recordedAt, entityVersion]
      properties:
        id: { type: string, minLength: 1 }
        studioId: { type: string, minLength: 1 }
        purchaseOrderId: { type: string, minLength: 1 }
        supplierId: { type: string, minLength: 1 }
        status: { const: CUSTOM_UNVERIFIED }
        supplierDocumentReference: { type: string, minLength: 1 }
        label: { type: string, minLength: 1 }
        documentCurrency: { $ref: '#/components/schemas/NonIDRCurrencyCode' }
        dppAmount: { $ref: '#/components/schemas/MoneyOutput' }
        taxAmount: { $ref: '#/components/schemas/MoneyOutput' }
        exchangeRateEvidence: { $ref: '#/components/schemas/ExchangeRateEvidence' }
        source: { $ref: '#/components/schemas/TaxRuleSource' }
        acceptedConfirmationText: { type: string, minLength: 1 }
        recordedById: { type: string, minLength: 1 }
        recordedAt: { type: string, format: date-time }
        entityVersion: { type: string, minLength: 1 }

    SupplierTaxRecordingWriteResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [supplierTaxRecording]
          properties:
            supplierTaxRecording:
              oneOf:
                - $ref: '#/components/schemas/SupplierTaxRecordingIDR'
                - $ref: '#/components/schemas/SupplierTaxRecordingNonIDR'
        meta: { $ref: '#/components/schemas/NativeWriteMeta' }

    TaxRuleDiscoveryResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [documentIssueDate, documentCurrency, resolvedVerifiedRule, customRules]
          properties:
            documentIssueDate: { type: string, format: date }
            documentCurrency: { const: IDR }
            resolvedVerifiedRule:
              oneOf:
                - $ref: '#/components/schemas/TaxRuleVerifiedRational'
                - $ref: '#/components/schemas/Null'
            customRules:
              type: array
              items:
                oneOf:
                  - $ref: '#/components/schemas/TaxRuleCustomRational'
                  - $ref: '#/components/schemas/TaxRuleCustomFixed'
        meta: { $ref: '#/components/schemas/Meta' }

    TaxCalculationRequest:
      type: object
      additionalProperties: false
      required: [documentIssueDate, documentCurrency,
        considerationBeforeDiscount, discount, taxApplication]
      properties:
        documentIssueDate: { type: string, format: date }
        documentCurrency: { const: IDR }
        considerationBeforeDiscount: { $ref: '#/components/schemas/MoneyInput' }
        discount: { $ref: '#/components/schemas/MoneyInput' }
        taxApplication:
          oneOf:
            - $ref: '#/components/schemas/TaxApplicationVerifiedRational'
            - $ref: '#/components/schemas/TaxApplicationCustomRule'

    TaxCalculationResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [result]
          properties:
            result: { $ref: '#/components/schemas/TaxCalculationResult' }
        meta: { $ref: '#/components/schemas/Meta' }

    ProjectQuotationIssueResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [quotation, taxSnapshot]
          properties:
            quotation: { $ref: '#/components/schemas/ProjectQuotation' }
            reviewLink:
              type:
                - object
                - 'null'
            taxSnapshot:
              oneOf:
                - $ref: '#/components/schemas/TaxSnapshot'
                - $ref: '#/components/schemas/Null'
        meta: { $ref: '#/components/schemas/NativeWriteMeta' }

    ProjectFinanceInvoiceIssueResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [invoice, taxSnapshot]
          properties:
            invoice: { $ref: '#/components/schemas/ProjectFinanceInvoice' }
            taxSnapshot:
              oneOf:
                - $ref: '#/components/schemas/TaxSnapshot'
                - $ref: '#/components/schemas/Null'
        meta: { $ref: '#/components/schemas/NativeWriteMeta' }
