openapi: 3.1.0
info:
  title: BusinessApp Native API
  version: 2026-06-23
  summary: Bearer-authenticated contract for native macOS workspaces.
servers:
  - url: /api/v1
security:
  - NativeAccessToken: []
  - BusinessAppSession: []
paths:
  /auth/token:
    post:
      operationId: exchangeNativeAuthToken
      summary: Exchange a single-use PKCE authorization code or rotate a refresh token.
      security: []
      parameters:
        - $ref: "#/components/parameters/NativeBuild"
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              oneOf:
                - $ref: "#/components/schemas/AuthorizationCodeTokenRequest"
                - $ref: "#/components/schemas/RefreshTokenRequest"
      responses:
        "200":
          description: Short-lived access token, rotating refresh token, and current staff identity.
          headers:
            Cache-Control:
              schema:
                const: no-store
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "400":
          $ref: "#/components/responses/OAuthProblem"
        "426":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"
  /auth/revoke:
    post:
      operationId: revokeNativeAuthToken
      summary: Revoke a native refresh-token family without revealing token state.
      security: []
      parameters:
        - $ref: "#/components/parameters/NativeBuild"
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/RevokeTokenRequest"
      responses:
        "200":
          description: Revocation accepted whether or not the submitted token was active.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevokeResponse"
        "400":
          $ref: "#/components/responses/OAuthProblem"
        "426":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"
  /me:
    get:
      operationId: getNativeMe
      summary: Return the authenticated staff user, company, native capabilities, and compatibility metadata.
      parameters:
        - $ref: "#/components/parameters/NativeBuild"
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: Authenticated native staff context.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "426":
          $ref: "#/components/responses/Problem"
  /my-work/tasks:
    get:
      operationId: listNativeMyWorkTasks
      summary: Return assigned or reviewer tasks for the authenticated staff user.
      parameters:
        - $ref: "#/components/parameters/NativeBuild"
        - $ref: "#/components/parameters/RequestId"
        - name: q
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            minimum: 1
            type: integer
        - name: pageSize
          in: query
          schema:
            default: 10
            maximum: 100
            minimum: 1
            type: integer
      responses:
        "200":
          description: Read-only My Work task list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskListResponse"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "426":
          $ref: "#/components/responses/Problem"
  /my-work/tasks/bulk:
    post:
      operationId: applyNativeTaskBulkMutation
      summary: Apply one guarded native task operation to multiple My Work targets.
      description: |
        Applies one task mutation to up to 100 target tasks. Each target carries its
        own task entity version, so optimistic concurrency is preserved per row.
        Outcomes are collected per target; one stale or denied task does not roll
        back successfully applied targets.
      parameters:
        - $ref: "#/components/parameters/NativeBuild"
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskBulkMutationRequest"
      responses:
        "200":
          description: Per-target task mutation outcomes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskBulkMutationResponse"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "426":
          $ref: "#/components/responses/Problem"
  /tasks/{id}:
    get:
      operationId: getNativeTask
      summary: Return one assigned or reviewer task with read-only detail fields.
      parameters:
        - $ref: "#/components/parameters/NativeBuild"
        - $ref: "#/components/parameters/RequestId"
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Read-only task detail.
          headers:
            ETag:
              description: Weak entity version for future conditional writes.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskDetailResponse"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "426":
          $ref: "#/components/responses/Problem"
  /tasks/{id}/assignable-users:
    get:
      operationId: listNativeTaskAssignableUsers
      summary: Return staff users eligible for the native task assignee picker.
      parameters:
        - $ref: "#/components/parameters/NativeBuild"
        - $ref: "#/components/parameters/RequestId"
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Staff users that can be selected as this task's assignee.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskAssignableUsersResponse"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "426":
          $ref: "#/components/responses/Problem"
  /tasks/{id}/reviewer:
    post:
      operationId: updateNativeTaskReviewer
      summary: Change one guarded online task reviewer for a permitted native task.
      parameters:
        - $ref: "#/components/parameters/NativeBuild"
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskReviewerRequest"
      responses:
        "200":
          description: Idempotent replay returned the previously saved reviewer change.
          headers:
            ETag:
              description: Current weak task entity version.
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
        "201":
          description: Task reviewer was changed.
          headers:
            ETag:
              description: Current weak task entity version.
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "426":
          $ref: "#/components/responses/Problem"
  /tasks/{id}/scope:
    post:
      operationId: updateNativeTaskScope
      summary: Change one guarded online task primary scope item for a permitted native task.
      parameters:
        - $ref: "#/components/parameters/NativeBuild"
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskScopeRequest"
      responses:
        "200":
          description: Idempotent replay returned the previously saved scope change.
          headers:
            ETag:
              description: Current weak task entity version.
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
        "201":
          description: Task primary scope item was changed.
          headers:
            ETag:
              description: Current weak task entity version.
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "426":
          $ref: "#/components/responses/Problem"
  /tasks/{id}/assignable-reviewers:
    get:
      operationId: listNativeTaskAssignableReviewers
      summary: Return staff users eligible for the native task reviewer picker.
      parameters:
        - $ref: "#/components/parameters/NativeBuild"
        - $ref: "#/components/parameters/RequestId"
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Staff users that can be selected as this task's reviewer.
          content:
            application/json:
              schema:
                type: object
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "426":
          $ref: "#/components/responses/Problem"
  /tasks/{id}/scope-options:
    get:
      operationId: listNativeTaskScopeOptions
      summary: Return selectable project scope items for the native task scope picker.
      parameters:
        - $ref: "#/components/parameters/NativeBuild"
        - $ref: "#/components/parameters/RequestId"
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Project scope items that can be selected as this task's scope.
          content:
            application/json:
              schema:
                type: object
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "426":
          $ref: "#/components/responses/Problem"
  /blueprints:
    get:
      operationId: listNativeProjectBlueprints
      summary: Return active project blueprints for the authenticated staff company.
      parameters:
        - $ref: "#/components/parameters/NativeBuild"
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: Read-only native project blueprint list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectBlueprintListResponse"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "426":
          $ref: "#/components/responses/Problem"
  /projects:
    get:
      operationId: listNativeProjects
      summary: Return project workspace records for the authenticated staff company.
      parameters:
        - $ref: "#/components/parameters/NativeBuild"
        - $ref: "#/components/parameters/RequestId"
        - name: q
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            minimum: 1
            type: integer
        - name: pageSize
          in: query
          schema:
            default: 10
            maximum: 100
            minimum: 1
            type: integer
      responses:
        "200":
          description: Read-only native project workspace list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectListResponse"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "426":
          $ref: "#/components/responses/Problem"
    post:
      operationId: createNativeProject
      summary: Create a guarded online project from a company blueprint.
      parameters:
        - $ref: "#/components/parameters/NativeBuild"
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectCreateRequest"
      responses:
        "200":
          description: Idempotent replay returned the previously created project.
          headers:
            ETag:
              description: Current weak project entity version.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectCreateResponse"
        "201":
          description: Project was created.
          headers:
            ETag:
              description: Current weak project entity version.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectCreateResponse"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "426":
          $ref: "#/components/responses/Problem"
  /projects/{id}:
    get:
      operationId: getNativeProject
      summary: Return one project workspace record with read-only detail fields.
      parameters:
        - $ref: "#/components/parameters/NativeBuild"
        - $ref: "#/components/parameters/RequestId"
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Read-only native project workspace detail.
          headers:
            ETag:
              description: Weak project entity version.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectDetailResponse"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "426":
          $ref: "#/components/responses/Problem"
    post:
      operationId: updateNativeProjectMetadata
      summary: Update guarded project overview description and next action.
      parameters:
        - $ref: "#/components/parameters/NativeBuild"
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectMetadataRequest"
      responses:
        "200":
          description: Idempotent replay returned the previously saved project overview update.
          headers:
            ETag:
              description: Current weak project entity version.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectStatusResponse"
        "201":
          description: Project overview fields were updated.
          headers:
            ETag:
              description: Current weak project entity version.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectStatusResponse"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "426":
          $ref: "#/components/responses/Problem"
  /projects/{id}/status:
    post:
      operationId: updateNativeProjectStatus
      summary: Change one guarded online project status for a permitted native user.
      parameters:
        - $ref: "#/components/parameters/NativeBuild"
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectStatusRequest"
      responses:
        "200":
          description: Idempotent replay returned the previously saved project status change.
          headers:
            ETag:
              description: Current weak project entity version.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectStatusResponse"
        "201":
          description: Project status was changed.
          headers:
            ETag:
              description: Current weak project entity version.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectStatusResponse"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "426":
          $ref: "#/components/responses/Problem"
  /projects/{id}/engagements/{engagementId}/phase-advance:
    post:
      operationId: advanceNativeEngagementPhase
      summary: Advance one guarded engagement phase for a permitted native project user.
      parameters:
        - $ref: "#/components/parameters/NativeBuild"
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: engagementId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EngagementPhaseAdvanceRequest"
      responses:
        "200":
          description: Idempotent replay returned the current engagement phase state.
          headers:
            ETag:
              description: Current weak engagement entity version.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EngagementPhaseAdvanceResponse"
        "201":
          description: Engagement phase was advanced.
          headers:
            ETag:
              description: Current weak engagement entity version.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EngagementPhaseAdvanceResponse"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "426":
          $ref: "#/components/responses/Problem"
  /projects/{id}/engagements/{engagementId}/contracts:
    get:
      operationId: getNativeEngagementContracts
      summary: Return the current contract projection of one engagement.
      parameters:
        - $ref: "#/components/parameters/NativeBuild"
        - $ref: "#/components/parameters/RequestId"
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: engagementId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Engagement contract register.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContractRegisterResponse"
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "426": { $ref: "#/components/responses/Problem" }
  /projects/{id}/engagements/{engagementId}/contracts/{contractId}:
    get:
      operationId: getNativeEngagementContract
      summary: Return one contract detail with revisions, evidence, and party snapshots.
      parameters:
        - $ref: "#/components/parameters/NativeBuild"
        - $ref: "#/components/parameters/RequestId"
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: engagementId
          in: path
          required: true
          schema:
            type: string
        - name: contractId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Engagement contract detail with its current entity version.
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContractDetailResponse"
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "426": { $ref: "#/components/responses/Problem" }
  /projects/{id}/engagements/{engagementId}/quotations:
    get:
      operationId: getNativeEngagementQuotations
      summary: Return engagement-scoped quotation pricing, terms, payment schedule, and revision state.
      parameters:
        - $ref: "#/components/parameters/NativeBuild"
        - $ref: "#/components/parameters/RequestId"
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: engagementId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Engagement quotations.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectQuotationsResponse"
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "426": { $ref: "#/components/responses/Problem" }
    post:
      operationId: createNativeEngagementQuotation
      summary: Create a native-authored draft quotation for one engagement.
      parameters:
        - $ref: "#/components/parameters/NativeBuild"
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: engagementId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectQuotationCreateRequest"
      responses:
        "200":
          description: Idempotent replay returned the quotation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectQuotationWriteResponse"
        "201":
          description: Draft quotation was created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectQuotationWriteResponse"
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/MutationConflict" }
        "422": { $ref: "#/components/responses/Problem" }
        "426": { $ref: "#/components/responses/Problem" }
  /projects/{id}/engagements/{engagementId}/quotations/{quotationId}:
    get:
      operationId: getNativeEngagementQuotation
      summary: Return one engagement quotation with its current entity version.
      parameters:
        - $ref: "#/components/parameters/NativeBuild"
        - $ref: "#/components/parameters/RequestId"
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: engagementId
          in: path
          required: true
