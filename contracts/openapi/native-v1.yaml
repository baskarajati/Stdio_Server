  /projects/{id}/files/{fileId}/download:
    post:
      operationId: downloadNativeProjectFile
      summary: Download one authorized project file for preview through the native app.
      description: |
        Streams the file body for an authorized preview. The server checks that the
        file belongs to the project and company, the file is ready, within the preview
        size limit, and an allowed preview MIME type. The response never exposes storage
        keys, signed object URLs, object URLs, or local server paths. The native app
        writes the body to an app-container cache and previews only the local file URL.
      parameters:
        - $ref: "#/components/parameters/NativeBuild"
        - $ref: "#/components/parameters/RequestId"
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: fileId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Authorized file body for native preview.
          headers:
            Content-Type:
              description: The file MIME type.
              schema:
                type: string
            Content-Length:
              description: File size in bytes.
              schema:
                type: integer
            X-BusinessApp-Native-File-Id:
              description: Stable file identifier (already visible in the project file list DTO).
              schema:
                type: string
            X-BusinessApp-Native-File-Size:
              description: File size in bytes.
              schema:
                type: integer
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "413":
          $ref: "#/components/responses/Problem"
        "415":
          $ref: "#/components/responses/Problem"
        "426":
          $ref: "#/components/responses/Problem"
