    post:
      operationId: downloadNativeTaskFile
      summary: Download one authorized task file for preview through the native app.
      description: |
        Streams the file body for an authorized preview. The server checks that the
        file is linked to the task, the task is assigned to or reviewed by the current
        staff user, the file is ready, within the preview size limit, and an allowed
        preview MIME type. The response never exposes storage keys, signed object URLs,         object URLs, or local server paths. The native app writes the body to an
        app-container cache and previews only the local file URL.
      parameters:
        - $ref: "#/components/parameters/NativeBuild"
        - $ref: "#/components/parameters/RequestId"
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: fileId
          in: path
          required: true
          schema:
            type: string
