        - NativeAccessToken: []
      parameters:
        - $ref: '#/components/parameters/NativeBuildRequired'
        - $ref: '#/components/parameters/RequestIdRequired'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SupplierTaxRecordingRequest'
      responses:
        '200':
          description: Idempotent replay returned the original supplier tax recording.
          headers:
            ETag:
              description: Current supplier recording entity version.
              required: true
              schema:
                minLength: 1
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupplierTaxRecordingWriteResponse'
        '201':
          description: Immutable supplier tax facts were recorded.
          headers:
            ETag:
              description: Current supplier recording entity version.
              required: true
              schema:
                minLength: 1
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupplierTaxRecordingWriteResponse'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/MutationConflict'
        '422':
          $ref: '#/components/responses/Problem'
        '426':
          $ref: '#/components/responses/Problem'
components:
  securitySchemes:
    BusinessAppSession:
      description: Existing signed staff browser session retained only for browser and E2E compatibility. Native clients must not persist or bridge this cookie.
      in: cookie
      name: businessapp_session
      type: apiKey
    NativeAccessToken:
      bearerFormat: Opaque
      description: Short-lived opaque access token issued by the native PKCE authorization flow.
      scheme: bearer
      type: http
  parameters:
    NativeBuild:
      name: x-businessapp-native-build
      in: header
      required: false
      schema:
        minimum: 1
        type: integer
    RequestId:
      name: x-request-id
      in: header
      required: false
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        maxLength: 200
        minLength: 8
        type: string
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
    NativeBuildRequired:
      name: x-businessapp-native-build
      in: header
      required: true
      schema:
        minimum: 1
        type: integer
    RequestIdRequired:
      name: x-request-id
      in: header
      required: true
      schema:
        minLength: 1
        type: string
    TaxCatalogTagRequired:
      name: x-stdio-tax-catalog-tag
      in: header
      required: true
      schema:
        minLength: 1
        type: string
    TaxCatalogTagOptional:
      name: x-stdio-tax-catalog-tag
      in: header
      required: false
      schema:
        minLength: 1
        type: string
  responses:
    OAuthProblem:
      description: OAuth-compatible error carried in the native structured problem format.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/OAuthProblem"
    Problem:
      description: Structured native problem response.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    MutationConflict:
      description: Conflict returned by a mutation. Either the Idempotency-Key was reused
        with a different body, or the If-Match guard failed on a stale or locked document.
      content:
        application/problem+json:
          schema:
            oneOf:
            - $ref: '#/components/schemas/EntityVersionConflictProblem'
            - $ref: '#/components/schemas/IdempotencyKeyReusedProblem'
  schemas:
    AuthorizationCodeTokenRequest:
