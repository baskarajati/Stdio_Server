    # ============================================================
    # SOL-25 revision 24 — Indonesian PPN launch preset contract.
    # Approved: Founding Engineer concur (SOL-88) + CEO confirmation
    # with three binding conditions (SOL-71 comment 8a45801d).
    # ============================================================
    MoneyOutput:
      type: string
      pattern: '^(?:(?:0|[1-9][0-9]{0,17})\.[0-9]{2}|-(?:0\.(?:0[1-9]|[1-9][0-9])|[1-9][0-9]{0,17}\.[0-9]{2}))$'
      description: >-
        Canonical signed decimal text with exactly two fractional digits and no
        exponent, leading plus sign, commas, insignificant leading zeroes, or
        negative zero. The serializer emits zero only as 0.00. The represented
        value must be within numeric(20,2).

    WholeIDRMoneyOutput:
      type: string
      pattern: '^(?:0|[1-9][0-9]{0,17}|-[1-9][0-9]{0,17})\.00$'
      description: >-
        Canonical whole-IDR response text. It uses exactly two zero fractional
        digits, rejects negative zero, and remains within numeric(20,2).

    RationalInteger:
      type: string
      pattern: '^-?[0-9]+$'

    PositiveRationalInteger:
      type: string
      pattern: '^[1-9][0-9]*$'

    CurrencyCode:
      type: string
      pattern: '^[A-Z]{3}$'

    NonIDRCurrencyCode:
      allOf:
        - $ref: '#/components/schemas/CurrencyCode'
        - not:
            const: IDR

    CustomTaxRuleCode:
      type: string
      minLength: 1
      not:
        const: PPN_STANDARD_2025

    "Null":
      type: 'null'

    Null:
      type: 'null'

    ExchangeRateEvidence:
      description: >-
        Documentary evidence entered by the user. The server stores this value
        verbatim. The server does not calculate, select, normalize, compare, or
        validate an exchange rate.
      oneOf:
        - type: string
          minLength: 1
        - type: object
          minProperties: 1
          additionalProperties: true

    TaxRuleSource:
      type: object
      additionalProperties: false
      required: [authority, title, url, publishedAt, retrievedAt]
      properties:
        authority:
          type: string
          minLength: 1
        title:
          type: string
          minLength: 1
        url:
          type: string
          format: uri
        publishedAt:
          oneOf:
            - type: string
              format: date
            - $ref: '#/components/schemas/Null'
        retrievedAt:
          type: string
          format: date-time

    VerifiedTaxEvidence:
      type: object
      additionalProperties: false
      required: [evidenceId, authority, documentIdentifier, title, url, publishedAt, retrievedAt]
      properties:
        evidenceId:
          type: string
          minLength: 1
        authority:
          enum: [KEMENKEU_RI, DJP_RI]
          type: string
        documentIdentifier:
          type: string
          minLength: 1
        title:
          type: string
          minLength: 1
        url:
          type: string
          format: uri
          pattern: '^https://(?:www\.)?(?:pajak\.go\.id|jdih\.kemenkeu\.go\.id)/'
        publishedAt:
          type: string
          format: date
        retrievedAt:
          type: string
          format: date-time

    VerifiedTaxExclusion:
      type: object
      additionalProperties: false
      required: [code, label]
      properties:
        code:
          type: string
          minLength: 1
        label:
          type: string
          minLength: 1

    TaxRule:
      oneOf:
        - $ref: '#/components/schemas/TaxRuleVerifiedRational'
        - $ref: '#/components/schemas/TaxRuleCustomRational'
        - $ref: '#/components/schemas/TaxRuleCustomFixed'

    TaxRuleVerifiedRational:
      type: object
      additionalProperties: false
      required: [id, version, ownerType, studioId, status, code, jurisdiction, taxType, currency,
        calculationMode, effectiveFrom, effectiveTo, verifiedAt,
        statutoryRateNumerator, statutoryRateDenominator, dppFactorNumerator,
        dppFactorDenominator, fixedAmount, roundingMode, roundingUnitMinor,
        roundDppBeforeTax, roundingStage, calculationScope, verifiedEvidence, exclusions,
        applicabilityConfirmationText, disclaimerText, entityVersion]
