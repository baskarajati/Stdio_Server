    MoneyInput:
      oneOf:
        - $ref: '#/components/schemas/MoneyInputString'
        - $ref: '#/components/schemas/MoneyInputNumber'
      description: Decimal money input accepted by the native write surface. The strict
        pair replaces the former loose oneOf; every consuming schema inherits the exact
        grammar, the 2^53 exactness bound, and the numeric(20,2) range (SOL-25 revision 24).
    MoneyInputString:
      type: string
      pattern: '^[+-]?[0-9]+(?:\.[0-9]+)?(?:[eE][+-]?[0-9]+)?$'
      description: >-
        Exact decimal text. At least one digit is required before an optional
        decimal point. A decimal point, when present, must be followed by at
        least one digit. An exponent marker, when present, must be followed by
        an optional sign and at least one digit. The server parses the original
        text with exact decimal arithmetic and rounds half-up to two decimal
        places. It never parses through binary floating point.
    MoneyInputNumber:
      type: number
      exclusiveMinimum: -9007199254740992
      exclusiveMaximum: 9007199254740992
      description: >-
        A finite JSON number strictly between -2^53 and 2^53. The server reads
        the shortest round-trip decimal token from the wire, parses that text
        exactly, and rounds half-up to two decimal places. It never performs a
        money calculation in binary floating point.
